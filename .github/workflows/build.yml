name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [21]
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4.2.2
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: build (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew build
      - name: build (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build
      - name: verify remapped JAR contents
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          artifact="build/libs/PRIMEX-TRG-CLIENT-1.21.11.jar"
          test -s "$artifact"
          jar tf "$artifact" > /tmp/primex-jar-contents.txt
          for entry in fabric.mod.json aoba.mixins.json aoba-sodium.mixins.json aoba.accesswidener net/aoba/mixin/sodium/SodiumMixinPlugin.class net/aoba/rendering/Renderer2D.class net/aoba/rendering/Renderer3D.class; do
            grep -Fxq "$entry" /tmp/primex-jar-contents.txt || { echo "Missing JAR entry: $entry"; exit 1; }
          done
      - name: capture remapped client artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4.6.0
        with:
          name: PRIMEX-TRG-CLIENT-1.21.11
          path: build/libs/PRIMEX-TRG-CLIENT-1.21.11.jar
          if-no-files-found: error

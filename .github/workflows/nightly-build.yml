name: Weekly Build

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a build even if no new commits"
        required: false
        type: boolean
        default: false

env:
  GAME_VERSION: "1.21.11"

concurrency:
  group: "weekly"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: commit_check
        run: |
          LAST_TAG=$(git tag -l 'build-*' --sort=-creatordate | head -n 1)
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          if [ -z "$LAST_TAG" ]; then
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          else
            COMMIT_COUNT=$(git rev-list ${LAST_TAG}..HEAD --count)
            echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "has_new_commits=true" >> $GITHUB_OUTPUT
            else
              echo "has_new_commits=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up JDK 21
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Grant execute permission for gradlew
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        run: ./gradlew build

      - name: Verify expected jar
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        run: test -f ./build/libs/PRIMEX-TRG-CLIENT-1.21.11.jar

      - name: Remove sources jar
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        run: rm -f ./build/libs/*-sources.jar

      - name: Create Release
        if: steps.commit_check.outputs.has_new_commits == 'true' || github.event.inputs.force_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.GAME_VERSION }}-${{ github.run_number }}
          name: "PRIMEX TRG CLIENT ${{ env.GAME_VERSION }} build ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          body: |
            **Game Version:** ${{ env.GAME_VERSION }}
            **Artifact:** PRIMEX-TRG-CLIENT-1.21.11.jar
          files: ./build/libs/PRIMEX-TRG-CLIENT-1.21.11.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
